project:
  name: profanity-classifier

task: text_classification
backend: pytorch

data:
  path: data.csv
  text_column: text
  target: label

features:
  type: tfidf
  lowercase: true
  analyzer: char_wb
  ngram_range: [3, 5]
  max_features: 5000

model:
  type: feedforward_text_classifier
  params:
    hidden_sizes: [64]
    dropout: 0.2

training:
  epochs: 120
  batch_size: 16
  learning_rate: 0.01
  random_state: 42
  device: auto

split:
  test_size: 0.25
  random_state: 42
  stratify: true

labels:
  positive_label: 1

output:
  model_path: ../../models/profanity-classifier.bin
  onnx_path: ../../models/profanity-classifier.onnx
  vectorizer_path: ../../models/profanity-classifier-vectorizer.json
  metrics_path: ../../models/profanity-classifier-metrics.json
