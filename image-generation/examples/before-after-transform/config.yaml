project:
  name: before-after-transform

task: paired_image_translation
backend: diffusers

data:
  pairs_path: sample-pairs.csv
  before_column: before
  after_column: after
  instruction_column: instruction

model:
  type: instruct_pix2pix_lora
  base_model: timbrooks/instruct-pix2pix
  params:
    rank: 16
    alpha: 16
    dropout: 0.0

training:
  resolution: 512
  batch_size: 1
  epochs: 1
  max_train_steps: 1000
  learning_rate: 0.0001
  mixed_precision: fp16
  gradient_checkpointing: true
  conditioning_dropout_prob: 0.05
  seed: 42
  device: auto
  num_workers: 0

output:
  adapter_path: ../../models/before-after-transform
  metrics_path: ../../models/before-after-transform-summary.json
