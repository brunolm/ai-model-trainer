[tools]
bun = "1.3.14"
python = "3.13.13"

[tasks.setup]
description = "Install Bun dependencies and the shared Python image inference dependencies."
run = [
  "bun install",
  'python -m venv ..\..\..\.venv',
  '..\..\..\.venv\Scripts\python.exe -m pip install -r ..\..\..\requirements.txt',
  '..\..\..\.venv\Scripts\python.exe -m pip install -r ..\..\..\requirements-image.txt',
]

[tasks.predict]
description = "Run the Node wrapper against the before-after-transform LoRA adapter."
run = "bun run src/index.ts --steps 20"
