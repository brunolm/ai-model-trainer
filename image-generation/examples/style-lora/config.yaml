project:
  name: style-lora

task: image_generation_lora
backend: diffusers

data:
  image_dir: images
  captions_path: captions.csv
  image_column: image
  caption_column: caption

model:
  type: stable_diffusion_lora
  base_model: runwayml/stable-diffusion-v1-5
  params:
    rank: 16
    alpha: 16
    dropout: 0.0

training:
  resolution: 512
  batch_size: 1
  epochs: 1
  max_train_steps: 1000
  learning_rate: 0.0001
  mixed_precision: fp16
  gradient_checkpointing: true
  seed: 42
  device: auto
  num_workers: 0

output:
  adapter_path: ../../models/style-lora
  metrics_path: ../../models/style-lora-summary.json
